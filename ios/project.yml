# XcodeGen spec for the Glasses Hub iPhone app. The workflow runs `xcodegen generate` on the GitHub Mac,
# so no hand-edited .xcodeproj lives in the repo.
name: GlassesHub
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  HubCore:
    path: HubCore
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: SVYYTM3LTN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  GlassesHub:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
    dependencies:
      - package: HubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarredsmith.glasseshub
        PRODUCT_NAME: GlassesHub
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Glasses Hub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Glasses Hub joins your RayNeo glasses' connection to show text on their display."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Glasses Hub reads today's events so it can show what's next on your glasses."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
